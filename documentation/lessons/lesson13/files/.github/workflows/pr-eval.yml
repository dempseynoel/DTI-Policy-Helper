# The PR gate: is this CODE good? Runs the PR's pipeline in-process against test's Search
# service and models, on a throwaway index built from the PR's own chunks. Blocks merge
# (make `pr-eval / eval` a required status check on main).
#
# Runs as id-dti-rag-eval: data-plane access to test's Search and models, and nothing that
# can touch a deployed app. PR code is unreviewed code.
name: pr-eval

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-eval-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: pr-eval
    env:
      APP_ENV: test
      AZURE_SEARCH_INDEX_OVERRIDE: dti-policy-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv sync --locked

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build this PR's chunks and its throwaway index
        run: |
          python -m dti_rag.ingestion
          python -m dti_rag.search.loader

      - name: Score the PR's code in-process, gated against the reference
        run: |
          REF=evaluation/baselines/reference-test.json
          if [ -f "$REF" ]; then
            python -m evaluation.run_eval --target local --compare "$REF" --out artifacts/eval/pr
          else
            # Bootstrap, once: there's nothing to gate against yet. Commit this run's
            # scorecard.json (attached below) as $REF in a follow-up PR.
            echo "::warning::No $REF yet: this run is NOT gated. Commit the attached scorecard.json as the reference."
            python -m evaluation.run_eval --target local --out artifacts/eval/pr
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-scorecard
          path: artifacts/eval/pr

      - name: Post the scorecard on the PR
        if: always() && hashFiles('artifacts/eval/pr/scorecard.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.number }} --body-file artifacts/eval/pr/scorecard.md

      - name: Delete the throwaway index
        if: always()
        run: python scripts/sweep_pr_indexes.py --index "$AZURE_SEARCH_INDEX_OVERRIDE"
