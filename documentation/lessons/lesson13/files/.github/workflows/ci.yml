# Fast, offline, on every push and pull request. No Azure, no secrets, seconds not minutes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts evaluation
      - name: Unit tests (no network)
        run: pytest
      - name: Chunking is deterministic
        run: |
          python -m dti_rag.ingestion --out /tmp/a.jsonl
          python -m dti_rag.ingestion --out /tmp/b.jsonl
          cmp /tmp/a.jsonl /tmp/b.jsonl
      - name: The image can't contain environment configuration
        run: |
          if grep -nE '^!(deploy|\.env|evaluation|artifacts)' .dockerignore; then
            echo "::error::.dockerignore admits environment config or eval code into the image"
            exit 1
          fi
