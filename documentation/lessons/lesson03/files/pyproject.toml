[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dti-rag"
version = "0.1.0"
description = "Edition-aware RAG assistant for DavidsTown HomeShield policy wordings"
requires-python = ">=3.11"
# Core dependencies: what the production container needs. Keep this list short.
dependencies = [
  "azure-identity>=1.19",
  "httpx>=0.27",
  "openai>=1.60",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Ingestion runs on your laptop and in CI, never in the app container.
ingest = ["pymupdf>=1.24"]
dev = [
  "dti-rag[ingest]",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dti_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs a live Azure environment; run with -m integration and APP_ENV set"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
